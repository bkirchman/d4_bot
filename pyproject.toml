[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d4_bot"
version = "0.1.0"
description = "Diablo 4 automation bot built on bot_framework"
requires-python = ">=3.10"
dependencies = [
    "bot_framework[ml]",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["d4_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]